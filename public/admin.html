<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin · OU PYQ Portal</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <a class="brand" href="/">OU PYQ Portal</a>
    <span>Admin</span>
  </header>

  <section class="card">
    <h2>Upload a paper</h2>
    <form id="upload">
      <div class="grid">
        <label>Branch
          <select name="branch" required>
            <option value="">Choose</option>
            <option>CSE</option><option>AIML</option><option>ECE</option><option>EEE</option>
            <option>MECH</option><option>CIVIL</option><option>IT</option>
          </select>
        </label>
        <label>Semester
          <select name="semester" required>
            <option value="">Choose</option>
            <option>1</option><option>2</option><option>3</option><option>4</option>
            <option>5</option><option>6</option><option>7</option><option>8</option>
          </select>
        </label>
        <label>Subject
          <input name="subject" required pattern="[A-Z]{2,20}" maxlength="20" placeholder="DBMS"
                 title="Short form in capitals, 2 to 20 letters, like DBMS">
        </label>
        <label>Year
          <select name="year" required><option value="">Choose</option></select>
        </label>
        <label>Exam
          <select name="exam_type">
            <option value="main">Main</option>
            <option value="backlog">Backlog</option>
          </select>
        </label>
        <label>PDF
          <input type="file" name="paper" accept=".pdf" required>
        </label>
      </div>
      <button>Upload</button>
      <p id="status"></p>
    </form>
  </section>

  <section class="card">
    <h2>Uploaded papers</h2>
    <ul id="papers"></ul>
  </section>

  <script src="admin.js"></script>
</body>
</html>
