
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OU PYQ Portal</title>
  <link rel="stylesheet" href="style.css">
  <!-- Runs before the page draws, so a saved theme never flashes the wrong colours -->
  <script>
    const theme = localStorage.getItem('theme');
    if (theme) document.documentElement.dataset.theme = theme;
  </script>
</head>
<body>
  <form method="get">
    <header>
      <a class="brand" href="./">OU PYQ Portal</a>
      <!-- The search input searches instantly as you type -->
      <input type="search" name="q" placeholder="Search">
      <button type="button" id="theme-toggle" aria-label="Switch light or dark mode">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
          <circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/>
          <path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor"/>
        </svg>
      </button>
    </header>

    <section class="card">
      <h2>Filters <button type="button" id="reset-filters">↺ Reset filters</button></h2>
      <div class="grid">
        <label>Branch
          <select name="branch">
            <option value="">All</option>
            <option>CSE</option><option>AIML</option><option>ECE</option><option>EEE</option>
            <option>MECH</option><option>CIVIL</option><option>IT</option>
          </select>
        </label>
        <label>Semester
          <select name="semester">
            <option value="">All</option>
            <option>1</option><option>2</option><option>3</option><option>4</option>
            <option>5</option><option>6</option><option>7</option><option>8</option>
          </select>
        </label>
        <label>Subject
          <select name="subject"><option value="">All</option></select>
        </label>
        <label>Year
          <select name="year"><option value="">All years</option></select>
        </label>

        <label>Exam Type
          <select name="exam_type">
            <option value="">All Types</option>
            <option value="main">Main</option>
            <option value="mid1">Mid 1</option>
            <option value="mid2">Mid 2</option>
            <option value="backlog">Backlog</option>
          </select>
        </label>

      </div>
    </section>
  </form>

  <section class="card">
    <h2 id="summary">Loading…</h2>
    <ul id="papers"></ul>
    
    <div id="pagination" class="pagination"></div>
  </section>

  <script src="student.js"></script>
   
  <!--Goat Counter tracker-->

  <script
    data-goatcounter="https://manikanth.goatcounter.com/count"
    async
    src="https://gc.zgo.at/count.js">
  </script>

   <!-- Contact Info Footer -->
    <footer style="text-align: center; padding: 20px; margin-top: 40px; color: #8b949e; font-size: 14px; border-top: 1px solid #30363d;">
      <p id="total-visits" >Total Visits: <span></span></p>
      <p>Want to add papers? Contact: <a href="mailto:toaddpapers@gmail.com" style="color: #58a6ff; text-decoration: none;">toaddpapers@gmail.com</a></p>
    </footer>
</body>
</html>
